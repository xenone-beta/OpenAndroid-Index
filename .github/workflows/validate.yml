name: Validate

on:
  pull_request:
    paths:
      - "apps/**"
      - "icons/**"
      - "screenshots/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      # Downloads every listed APK and checks package name, signature, license and file name.
      - name: Check all apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_index.py --check --out "$RUNNER_TEMP/check"
